<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120">
  <rect width="300" height="120" rx="6" fill="#0F165C"/>

  <!-- Lion Rampant -->
  <g transform="translate(28, 12) scale(0.72)" fill="white">
    <!-- Head -->
    <ellipse cx="38" cy="18" rx="10" ry="11"/>
    <!-- Mane tufts -->
    <circle cx="30" cy="10" r="4"/>
    <circle cx="36" cy="6" r="4"/>
    <circle cx="44" cy="7" r="3.5"/>
    <circle cx="47" cy="13" r="3"/>
    <!-- Ear -->
    <ellipse cx="29" cy="14" rx="3" ry="5" transform="rotate(-15 29 14)"/>
    <!-- Eye (navy cutout) -->
    <circle cx="36" cy="16" r="2" fill="#0F165C"/>
    <!-- Snout -->
    <ellipse cx="43" cy="22" rx="5" ry="3.5"/>
    <!-- Mouth line -->
    <line x1="41" y1="24" x2="46" y2="23" stroke="#0F165C" stroke-width="0.8"/>

    <!-- Torso -->
    <path d="M32,28 C28,32 24,42 26,55 C27,60 30,64 34,66 L48,66 C52,64 54,58 53,50 C52,42 48,34 44,28 Z"/>

    <!-- Front left leg (raised, pawing) -->
    <path d="M34,34 L18,22 L16,26 L30,38" fill="white"/>
    <!-- Front left paw -->
    <ellipse cx="16" cy="23" rx="3.5" ry="2.5" transform="rotate(-30 16 23)"/>

    <!-- Front right leg (raised forward) -->
    <path d="M42,32 L56,18 L59,21 L46,36" fill="white"/>
    <!-- Front right paw -->
    <ellipse cx="58" cy="18" rx="3.5" ry="2.5" transform="rotate(30 58 18)"/>

    <!-- Rear left leg -->
    <path d="M30,60 L26,78 L22,86 L26,87 L30,80 L34,66" fill="white"/>
    <!-- Rear left paw -->
    <rect x="21" y="84" width="7" height="3" rx="1.5"/>

    <!-- Rear right leg -->
    <path d="M42,60 L44,78 L46,86 L50,86 L48,78 L46,66" fill="white"/>
    <!-- Rear right paw -->
    <rect x="45" y="84" width="7" height="3" rx="1.5"/>

    <!-- Tail (curving up with flourish) -->
    <path d="M28,55 C20,50 14,40 12,30 C11,24 14,18 18,16" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Tail tuft -->
    <circle cx="18" cy="15" r="3.5"/>
    <circle cx="14" cy="13" r="2.5"/>
    <circle cx="20" cy="12" r="2"/>
  </g>

  <!-- SMU Text -->
  <text x="108" y="58" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" fill="white" letter-spacing="5">SMU</text>

  <!-- Subtitle -->
  <text x="108" y="78" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="white" letter-spacing="1.2" font-weight="400">SINGAPORE MANAGEMENT</text>
  <text x="108" y="92" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="white" letter-spacing="1.2" font-weight="400">UNIVERSITY</text>
</svg>
